services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pereprodai
      POSTGRES_PASSWORD: pereprodai_pwd
      POSTGRES_DB: pereprodai
    ports:
      - "5583:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  elasticsearch:
    image: elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9247:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  redis:
    image: redis:7
    ports:
      - "6399:6379"
    volumes:
      - redis-data:/data

  app:
    build:
      context: .
      dockerfile: src/Pereprodai.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__CatalogDb=Host=postgres;Port=5432;Database=pereprodai;Username=pereprodai;Password=pereprodai_pwd
      - Redis__ConnectionString=redis:6379
      - Elasticsearch__Url=http://elasticsearch:9200
    depends_on:
      - postgres
      - redis
      - elasticsearch

volumes:
  postgres-data:
  elasticsearch-data:
  redis-data:
